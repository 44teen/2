<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>44Rai</title>
    <!-- Menggunakan font bergaya iOS (SF Pro) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff; /* Mengubah background menjadi putih */
            color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            text-align: center;
        }

        /* Halaman Login */
        #login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        /* Logo Gembok iOS Simple Warna Gelap/Hitam di atas background putih */
        .lock-icon {
            width: 36px;
            height: 36px;
            margin-bottom: 28px;
            fill: #1c1c1e;
        }

        .password-form {
            display: flex;
            width: 100%;
            background: #f2f2f7; /* Warna abu-abu khas input iOS */
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .password-form:focus-within {
            border-color: #007aff; /* Warna aksen biru iOS saat aktif */
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        /* Input field dengan karakter bulat tersembunyi (password dots) */
        .password-input {
            width: 100%;
            border: none;
            padding: 14px 18px;
            font-size: 17px;
            outline: none;
            color: #000000;
            background: transparent;
            text-align: center;
            letter-spacing: 2px; /* Memberikan jarak agar titik-titik terlihat rapi */
        }

        .password-input::placeholder {
            letter-spacing: normal;
            color: #8e8e93;
        }

        .back-home {
            color: #007aff; /* Warna biru khas link iOS */
            font-size: 15px;
            text-decoration: none;
            margin-top: 12px;
            font-weight: 400;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff3b30; /* Warna merah khas error iOS */
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Halaman Konten Setelah Login (Tulisan FUCK YOU) */
        #content-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .content-title {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #000000;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .logout-btn {
            background: #f2f2f7;
            color: #ff3b30;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:active {
            background: #e5e5ea;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BAGIAN 1: HALAMAN LOGIN -->
        <div id="login-section">
            <!-- Icon Gembok Simple Gaya iOS -->
            <svg class="lock-icon" viewBox="0 0 24 24">
                <path d="M12 2C9.24 2 7 4.24 7 7v3H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v3H9V7c0-1.66 1.34-3 3-3zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
            </svg>
            
            <!-- Form Input Sandi (Otomatis Menjadi Titik-titik Bulat Saat Diketik) -->
            <form class="password-form" onsubmit="checkPassword(event)">
                <input type="password" id="password-box" class="password-input" placeholder="Masukkan sandi" autocomplete="current-password" required autofocus>
            </form>
            
            <div id="error-message" class="error-msg">Kata sandi salah</div>
            <a href="#" class="back-home" onclick="resetForm(event)">Back to home</a>
        </div>

        <!-- BAGIAN 2: HALAMAN SETELAH MASUK (TULISAN FUCK YOU) -->
        <div id="content-section">
            <h1 class="content-title">FUCK YOU</h1>
            <button class="logout-btn" onclick="logout()">Keluar</button>
        </div>
    </div>

    <script>
        // Password default: 44rai (dapat diubah sesuai keinginan)
        const CORRECT_PASSWORD = "44rai";

        const passwordInput = document.getElementById("password-box");

        // Fitur otomatis cek sandi saat user selesai mengetik/menekan Enter
        function checkPassword(event) {
            event.preventDefault();
            const inputVal = passwordInput.value;
            const errorMsg = document.getElementById("error-message");

            if (inputVal === CORRECT_PASSWORD) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("content-section").style.display = "flex";
                errorMsg.style.display = "none";
            } else {
                errorMsg.style.display = "block";
                passwordInput.value = "";
            }
        }

        // Alternatif: Begitu password mencapai panjang tertentu atau ditekan enter, langsung validasi
        passwordInput.addEventListener("input", function() {
            if (passwordInput.value === CORRECT_PASSWORD) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("content-section").style.display = "flex";
                document.getElementById("error-message").style.display = "none";
                passwordInput.value = "";
            }
        });

        function resetForm(event) {
            event.preventDefault();
            passwordInput.value = "";
            document.getElementById("error-message").style.display = "none";
        }

        function logout() {
            document.getElementById("content-section").style.display = "none";
            document.getElementById("login-section").style.display = "flex";
            passwordInput.value = "";
            passwordInput.focus();
        }
    </script>
</body>
</html>
